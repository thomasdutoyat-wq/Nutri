<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NutriQuest ⚔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0c0b18;--bg2:#13112a;--bg3:#1c1a38;--card:#1f1d3a;--card2:#272452;
  --border:#2e2b56;--gold:#f5b53f;--xp:#818cf8;--xp2:#a5b4fc;
  --fire:#fb923c;--teal:#2dd4bf;--danger:#f87171;--hp:#4ade80;
  --fg:#e8e5ff;--fg2:#9d99c8;--fg3:#6b6896;
  --thomas:#818cf8;--emilie:#f472b6;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:'Inter',system-ui,sans-serif;font-size:14px;display:flex;flex-direction:column;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg2);z-index:11;}

#app{flex:1;display:flex;flex-direction:column;overflow:hidden;}

/* TOP BAR */
#topbar{background:var(--bg2);border-bottom:1px solid var(--border);
  padding:10px max(16px,env(safe-area-inset-left,16px));
  display:flex;align-items:center;gap:10px;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:10;flex-shrink:0;}
.logo{font-family:'Cinzel',serif;font-size:16px;font-weight:700;
  background:linear-gradient(135deg,var(--gold),var(--xp2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;flex:1;}
#profile-toggle{display:flex;border:1px solid var(--border);border-radius:20px;overflow:hidden;}
.ptog{padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;background:transparent;border:none;color:var(--fg2);transition:.2s;}
.ptog.on-t{background:var(--thomas);color:#0a0a1a;}
.ptog.on-e{background:var(--emilie);color:#0a0a1a;}
#team-btn{padding:5px 10px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--fg2);cursor:pointer;font-size:12px;}

#main{flex:1;overflow-y:auto;overflow-x:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));
  padding-right:max(0px,env(safe-area-inset-right,0px));}

/* NAV */
#nav{background:var(--bg2);border-top:1px solid var(--border);
  display:grid;grid-template-columns:repeat(4,1fr);flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom,0px);}
.nb{display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 4px;border:none;background:transparent;color:var(--fg3);
  cursor:pointer;font-size:10px;font-weight:500;letter-spacing:.03em;text-transform:uppercase;transition:.2s;}
.nb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;}
.nb.on{color:var(--gold);}

.page{display:none;padding:16px max(16px,env(safe-area-inset-left,16px)) 32px;}
.page.on{display:block;}

/* HERO CARD */
.hero-card{background:linear-gradient(135deg,var(--bg3),var(--card));border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:16px;display:flex;gap:20px;align-items:center;}
.hero-rings{position:relative;width:120px;height:120px;flex-shrink:0;}
.hero-rings svg{width:120px;height:120px;transform:rotate(-90deg);}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-kcal{font-size:22px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
.ring-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg3);}
.hero-info{flex:1;min-width:0;}
.hero-name{font-family:'Cinzel',serif;font-size:15px;font-weight:700;margin-bottom:4px;}
.hero-lvl{font-size:12px;color:var(--fg2);margin-bottom:10px;}
.xpbw{margin-bottom:12px;}
.xpbl{display:flex;justify-content:space-between;font-size:11px;color:var(--fg3);margin-bottom:4px;}
.xpb{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;}
.xpf{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--xp),var(--xp2));transition:width .5s ease;}
.macro-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.mc{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:7px;text-align:center;}
.mc .mv{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
.mc .ml{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg3);}
.mc .mb{height:3px;border-radius:2px;background:var(--bg);margin-top:4px;overflow:hidden;}
.mc .mbf{height:100%;border-radius:2px;transition:width .5s;}

.sh{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.sh::after{content:"";flex:1;height:1px;background:var(--border);}

.log-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.log-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;}
.li-emoji{font-size:22px;width:36px;text-align:center;flex-shrink:0;}
.li-info{flex:1;min-width:0;}
.li-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.li-mac{font-size:11px;color:var(--fg2);}
.li-del{padding:4px 8px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--fg3);cursor:pointer;font-size:11px;flex-shrink:0;}
.li-del:hover{border-color:var(--danger);color:var(--danger);}
.empty{text-align:center;padding:32px 16px;color:var(--fg3);}
.empty-ic{font-size:40px;margin-bottom:8px;}

/* SCAN */
.scan-zone{border:2px dashed var(--border);border-radius:20px;padding:32px 20px;text-align:center;background:var(--bg3);margin-bottom:16px;position:relative;transition:.2s;}
.scan-zone:hover{border-color:var(--gold);background:var(--card);}
.sz-ic{font-size:48px;margin-bottom:12px;}
.scan-zone p{color:var(--fg2);line-height:1.6;}
#photo-input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
#scan-prev{display:none;margin-bottom:16px;}
#scan-prev img{width:100%;max-height:220px;object-fit:cover;border-radius:14px;border:1px solid var(--border);}

/* STATUS */
.status-line{display:flex;align-items:center;gap:10px;padding:14px;background:var(--bg3);border-radius:12px;margin-bottom:12px;font-size:13px;color:var(--fg2);}
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--gold);animation:spin .8s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-badge{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,rgba(129,140,248,.15),rgba(248,113,113,.15));border:1px solid rgba(129,140,248,.4);border-radius:8px;padding:4px 10px;font-size:11px;color:var(--xp2);letter-spacing:.04em;margin-bottom:12px;}

/* FOOD CARD */
.food-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;}
.fc-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.fc-emoji{font-size:36px;}
.fc-name{font-size:16px;font-weight:700;margin-bottom:2px;}
.fc-src{font-size:11px;color:var(--fg3);}
.fc-macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.fcm{background:var(--bg3);border-radius:8px;padding:8px;text-align:center;}
.fcm .fv{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;}
.fcm .fl{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg3);}
.qty-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.qty-row label{font-size:12px;color:var(--fg2);white-space:nowrap;}
.qty-inp{width:70px;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--fg);font-size:14px;font-weight:600;text-align:center;}
.qty-row span{font-size:12px;color:var(--fg3);}
.add-btn{width:100%;padding:13px;border-radius:12px;border:none;cursor:pointer;font-size:14px;font-weight:700;letter-spacing:.04em;transition:.2s;background:linear-gradient(135deg,var(--gold),var(--fire));color:#0a0a1a;}
.add-btn:hover{opacity:.85;}
.ghost-btn{padding:9px 16px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--fg2);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.2s;width:100%;justify-content:center;margin-top:4px;}
.ghost-btn:hover{border-color:var(--gold);color:var(--gold);}

/* SEARCH */
.search-bar{display:flex;gap:8px;margin-bottom:16px;}
.si{flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg3);color:var(--fg);font-size:14px;outline:none;transition:.2s;}
.si:focus{border-color:var(--gold);}
.sb{padding:11px 16px;border-radius:12px;border:none;cursor:pointer;background:var(--gold);color:#0a0a1a;font-weight:700;font-size:14px;white-space:nowrap;}
.sr-list{display:flex;flex-direction:column;gap:8px;}
.sr-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.2s;}
.sr-item:hover,.sr-item:active{border-color:var(--gold);background:var(--card2);}
.sr-name{font-size:13px;font-weight:600;margin-bottom:4px;}
.sr-mac{font-size:11px;color:var(--fg2);}
.sr-cta{font-size:11px;color:var(--gold);text-align:right;margin-top:4px;}

/* ALTERNATIVES */
.alt-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.alt-item{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:9px 12px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:space-between;}
.alt-item:hover{border-color:var(--xp);background:var(--card);}
.alt-name{font-size:12px;font-weight:500;}
.alt-kcal{font-size:11px;color:var(--gold);font-variant-numeric:tabular-nums;}

/* TEAM */
.team-hdr{background:linear-gradient(135deg,#1a0d3f,#0d1a3f);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:16px;text-align:center;}
.team-title{font-family:'Cinzel',serif;font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--gold),var(--xp2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px;}
.team-sub{font-size:12px;color:var(--fg2);margin-bottom:16px;}
.txp-row{display:flex;justify-content:center;gap:32px;margin-bottom:16px;}
.txp-cell{text-align:center;}
.txv{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;}
.txl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg3);}
.tlb-label{display:flex;justify-content:space-between;font-size:11px;color:var(--fg3);margin-bottom:4px;}
.tlb-track{height:8px;border-radius:4px;background:var(--bg);overflow:hidden;}
.tlb-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--thomas),var(--emilie));transition:width .5s;}
.boss-card{background:linear-gradient(135deg,#2a0a0a,#1a0a2a);border:2px solid #7f1d1d;border-radius:20px;padding:20px;margin-bottom:16px;}
.boss-top{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.boss-emoji{font-size:48px;}
.boss-name{font-family:'Cinzel',serif;font-size:16px;font-weight:700;color:var(--danger);margin-bottom:4px;}
.boss-desc{font-size:12px;color:var(--fg2);}
.hp-label{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;}
.hp-track{height:10px;border-radius:5px;background:#0a0a0a;overflow:hidden;border:1px solid #3f1414;}
.hp-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#ef4444,#f97316);transition:width .5s;}
.profiles-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.pc{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;}
.pc.t{border-color:color-mix(in srgb,var(--thomas) 40%,transparent);}
.pc.e{border-color:color-mix(in srgb,var(--emilie) 40%,transparent);}
.pc-name{font-family:'Cinzel',serif;font-size:13px;font-weight:700;margin-bottom:2px;}
.pc-name.t{color:var(--thomas);}.pc-name.e{color:var(--emilie);}
.pc-lvl{font-size:11px;color:var(--fg3);margin-bottom:8px;}
.pc-xpb{height:4px;border-radius:2px;background:var(--bg);overflow:hidden;}
.pc-xpf{height:100%;border-radius:2px;transition:width .5s;}
.pc-xpf.t{background:var(--thomas);}.pc-xpf.e{background:var(--emilie);}
.pc-stats{margin-top:8px;display:flex;flex-direction:column;gap:4px;}
.pc-stat{font-size:11px;color:var(--fg2);display:flex;justify-content:space-between;}
.pc-stat span:last-child{font-weight:600;font-variant-numeric:tabular-nums;}
.sc-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.sc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;}
.scv{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:2px;}
.scl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg3);}
.xp-tips{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;}
.xp-tip-row{display:flex;align-items:center;justify-content:space-between;}
.xp-tip-row span:first-child{font-size:13px;color:var(--fg2);}
.xp-tip-row span:last-child{font-size:12px;font-weight:700;color:var(--gold);}

/* TOAST / XP POPUP */
#toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px 20px;font-size:13px;font-weight:600;color:var(--fg);opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;z-index:100;box-shadow:0 8px 32px rgba(0,0,0,.5);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#xppop{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);left:50%;transform:translateX(-50%) scale(.8);font-family:'Cinzel',serif;font-size:22px;font-weight:700;color:var(--gold);pointer-events:none;opacity:0;text-shadow:0 0 20px var(--gold);z-index:101;transition:opacity .2s,transform .3s;}
#xppop.show{opacity:1;transform:translateX(-50%) scale(1) translateY(-20px);}

::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
input:focus{outline:2px solid var(--gold);outline-offset:2px;}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="logo">⚔ NutriQuest</div>
    <div id="profile-toggle">
      <button class="ptog on-t" id="pt-thomas">Thomas</button>
      <button class="ptog" id="pt-emilie">Emilie</button>
    </div>
    <button id="team-btn">🛡 Équipe</button>
  </div>

  <div id="main">
    <!-- ACCUEIL -->
    <div id="page-dash" class="page on">
      <div id="hero-card" class="hero-card"></div>
      <div class="sh">Repas du jour</div>
      <div id="log-list" class="log-list"></div>
      <button id="add-meal-btn" class="ghost-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M12 5v14M5 12h14"/></svg>
        Ajouter un repas
      </button>
    </div>

    <!-- SCAN -->
    <div id="page-scan" class="page">
      <div class="sh" style="margin-bottom:12px">Détecter un aliment</div>
      <div class="scan-zone" id="scan-zone">
        <div class="sz-ic">📸</div>
        <p><strong>Prends une photo de ton repas</strong><br>L'IA détecte l'aliment automatiquement</p>
        <input type="file" id="photo-input" accept="image/*">
      </div>
      <div id="scan-prev"><img id="prev-img" src="" alt="Preview"></div>
      <div id="scan-status"></div>
      <div id="scan-result"></div>

      <div class="sh" style="margin-top:8px">Ou chercher manuellement</div>
      <div class="search-bar" style="margin-top:0">
        <input class="si" id="scan-si" placeholder="Poulet, riz, yaourt…" type="text">
        <button class="sb" id="scan-sb">Go</button>
      </div>
      <div id="scan-sr" class="sr-list"></div>
      <div id="scan-fc"></div>
    </div>

    <!-- CHERCHER -->
    <div id="page-search" class="page">
      <div class="sh" style="margin-bottom:8px">Base USDA</div>
      <div class="ai-badge">✦ 600 000+ aliments · USDA FoodData Central</div>
      <div class="search-bar">
        <input class="si" id="main-si" placeholder="Rechercher un aliment…" type="text">
        <button class="sb" id="main-sb">Chercher</button>
      </div>
      <div id="main-sr" class="sr-list"></div>
      <div id="main-fc"></div>
    </div>

    <!-- ÉQUIPE -->
    <div id="page-team" class="page"></div>
  </div>

  <nav id="nav">
    <button class="nb on" id="nb-dash">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Accueil
    </button>
    <button class="nb" id="nb-scan">
      <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      Scanner
    </button>
    <button class="nb" id="nb-search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Chercher
    </button>
    <button class="nb" id="nb-team">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Équipe
    </button>
  </nav>
</div>

<div id="toast"></div>
<div id="xppop"></div>

<script>
// ═══════════════════════════════════════════
// PROFILES & LEVELS
// ═══════════════════════════════════════════
const PROFILES = {
  thomas:{name:'Thomas',color:'#818cf8',cls:'t',avatar:'⚔',goals:{kcal:2500,prot:170,carb:270,fat:72}},
  emilie:{name:'Emilie',color:'#f472b6',cls:'e',avatar:'🌸',goals:{kcal:1500,prot:100,carb:160,fat:50}}
};
const LEVELS=[
  {lvl:1,xp:0,name:'Novice'},{lvl:2,xp:100,name:'Apprenti'},{lvl:3,xp:250,name:'Guerrier'},
  {lvl:4,xp:500,name:'Champion'},{lvl:5,xp:1000,name:'Héros'},{lvl:6,xp:2000,name:'Légende'},
  {lvl:7,xp:4000,name:'Mythique'},{lvl:8,xp:8000,name:'Transcendant'}
];

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let CP = 'thomas';
let ST = { thomas:null, emilie:null, shared:null };

function todayKey(){return new Date().toISOString().slice(0,10);}
function weekKey(){const d=new Date(),s=new Date(d.getFullYear(),0,1);return d.getFullYear()+'-W'+Math.ceil(((d-s)/86400000+s.getDay()+1)/7);}

function loadState(){
  try{
    ST.thomas=JSON.parse(localStorage.getItem('nq_thomas')||'null')||{xp:0,log:{},wins:[]};
    ST.emilie=JSON.parse(localStorage.getItem('nq_emilie')||'null')||{xp:0,log:{},wins:[]};
    ST.shared=JSON.parse(localStorage.getItem('nq_shared')||'null')||{bossHp:1000,bossMax:1000,week:weekKey(),dailyWins:{}};
    if(ST.shared.week!==weekKey()) ST.shared={bossHp:1000,bossMax:1000,week:weekKey(),dailyWins:{}};
  }catch(e){
    ST.thomas={xp:0,log:{},wins:[]};
    ST.emilie={xp:0,log:{},wins:[]};
    ST.shared={bossHp:1000,bossMax:1000,week:weekKey(),dailyWins:{}};
  }
}
function saveState(){
  try{
    localStorage.setItem('nq_thomas',JSON.stringify(ST.thomas));
    localStorage.setItem('nq_emilie',JSON.stringify(ST.emilie));
    localStorage.setItem('nq_shared',JSON.stringify(ST.shared));
  }catch(e){}
}
function todayLog(id){return ST[id].log[todayKey()]||[];}
function todayTotals(id){return todayLog(id).reduce((a,i)=>({kcal:a.kcal+i.kcal,prot:a.prot+i.prot,carb:a.carb+i.carb,fat:a.fat+i.fat}),{kcal:0,prot:0,carb:0,fat:0});}
function getLvl(xp){
  let cur=LEVELS[0],nxt=LEVELS[1];
  for(let i=LEVELS.length-1;i>=0;i--){if(xp>=LEVELS[i].xp){cur=LEVELS[i];nxt=LEVELS[i+1]||null;break;}}
  return{...cur,prog:nxt?Math.min(1,(xp-cur.xp)/(nxt.xp-cur.xp)):1,nextXp:nxt?nxt.xp:null,curXp:xp};
}

function addXP(id,amount){
  ST[id].xp+=amount;
  ST.shared.bossHp=Math.max(0,ST.shared.bossHp-Math.floor(amount/10));
  saveState();showXP('+'+amount+' XP');checkGoals(id);
}
function checkGoals(id){
  const today=todayKey(),key=id+'_'+today;
  const t=todayTotals(id),g=PROFILES[id].goals;
  if(!ST.shared.dailyWins)ST.shared.dailyWins={};
  if(t.kcal>=g.kcal*0.9&&t.prot>=g.prot*0.85&&!ST.shared.dailyWins[key]){
    ST.shared.dailyWins[key]=true;ST[id].xp+=100;
    ST.shared.bossHp=Math.max(0,ST.shared.bossHp-100);
    if(!ST[id].wins)ST[id].wins=[];
    if(!ST[id].wins.includes(today))ST[id].wins.push(today);
    saveState();
    setTimeout(()=>{showToast('🎯 Objectifs atteints ! +100 XP · Boss -100 HP');showXP('+100 XP');},800);
  }
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200);}
function showXP(txt){const p=document.getElementById('xppop');p.textContent=txt;p.classList.add('show');setTimeout(()=>p.classList.remove('show'),1500);}

function ring(r,pct,color,sw){
  const c=2*Math.PI*r,dash=pct*c;
  return`<circle cx="60" cy="60" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="${sw}"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-dasharray="${dash.toFixed(1)} ${c.toFixed(1)}" stroke-linecap="round"/>`;
}
function foodEmoji(n){
  n=(n||'').toLowerCase();
  if(/poulet|chicken|dinde|turkey/.test(n))return'🍗';
  if(/boeuf|beef|steak/.test(n))return'🥩';
  if(/poisson|saumon|thon|fish|salmon|tuna/.test(n))return'🐟';
  if(/oeuf|egg/.test(n))return'🥚';
  if(/lait|milk/.test(n))return'🥛';
  if(/fromage|cheese/.test(n))return'🧀';
  if(/pain|bread/.test(n))return'🍞';
  if(/riz|rice/.test(n))return'🍚';
  if(/pâtes|pasta|spaghetti/.test(n))return'🍝';
  if(/flocon|oat|porridge/.test(n))return'🥣';
  if(/pomme|apple/.test(n))return'🍎';
  if(/banane|banana/.test(n))return'🍌';
  if(/avocat|avocado/.test(n))return'🥑';
  if(/yaourt|yogurt|skyr/.test(n))return'🫙';
  if(/amande|noix|nut|cashew/.test(n))return'🥜';
  if(/huile|oil/.test(n))return'🫒';
  if(/salade|salad/.test(n))return'🥗';
  if(/whey|protéine|caseine/.test(n))return'💪';
  if(/chocolat|chocolate/.test(n))return'🍫';
  if(/pizza/.test(n))return'🍕';
  if(/burger/.test(n))return'🍔';
  return'🍽';
}

// ═══════════════════════════════════════════
// API — HuggingFace + USDA
// ═══════════════════════════════════════════
async function detectFoodFromImage(imageBytes){
  const res=await fetch('https://api-inference.huggingface.co/models/Kaludi/food-category-classification-v2.0',
    {method:'POST',headers:{'Content-Type':'application/octet-stream'},body:imageBytes});
  if(!res.ok)throw new Error('HF_'+res.status);
  const preds=await res.json();
  if(!Array.isArray(preds)||!preds.length)throw new Error('no_pred');
  return preds.sort((a,b)=>b.score-a.score);
}

async function fetchUSDA(query,n=5){
  const url=`https://api.nal.usda.gov/fdc/v1/foods/search?query=${encodeURIComponent(query)}&api_key=DEMO_KEY&pageSize=${n}&dataType=Foundation,SR%20Legacy`;
  const res=await fetch(url);
  if(!res.ok)throw new Error('USDA_'+res.status);
  const data=await res.json();
  return(data.foods||[]).map(f=>{
    const nm={};
    (f.foodNutrients||[]).forEach(n=>{nm[n.nutrientId]=n.value;});
    return{name:f.description,kcal:nm[1008]||0,prot:nm[1003]||0,carb:nm[1005]||0,fat:nm[1004]||0};
  }).filter(f=>f.kcal>0);
}

function addFoodToLog(food,qty,isPhotoScan=false){
  const f=qty/100;
  const entry={
    name:food.name,
    emoji:foodEmoji(food.name),
    qty,
    kcal:Math.round((food.kcal||0)*f),
    prot:Math.round((food.prot||0)*f*10)/10,
    carb:Math.round((food.carb||0)*f*10)/10,
    fat:Math.round((food.fat||0)*f*10)/10
  };
  const today=todayKey();
  if(!ST[CP].log[today])ST[CP].log[today]=[];
  ST[CP].log[today].push(entry);
  addXP(CP,isPhotoScan?30:15);
  saveState();
  showToast('✅ '+entry.name+' ajouté !');
  renderDash();
}

// PHOTO SCAN
// ═══════════════════════════════════════════
document.getElementById('photo-input').addEventListener('change',async function(){
  if(!this.files[0])return;
  const file=this.files[0];

  // Show preview
  document.getElementById('prev-img').src=URL.createObjectURL(file);
  document.getElementById('scan-prev').style.display='block';
  document.getElementById('scan-result').innerHTML='';

  const statusEl=document.getElementById('scan-status');

  // Step 1: AI detection
  statusEl.innerHTML=`<div class="status-line"><div class="spinner"></div>🤖 Analyse de la photo…</div>`;
  let preds;
  try{
    const bytes=await file.arrayBuffer();
    preds=await detectFoodFromImage(bytes);
  }catch(e){
    statusEl.innerHTML=`<div class="status-line" style="color:var(--danger)">⚠ IA indisponible. Utilise la recherche manuelle ci-dessous.</div>`;
    return;
  }

  const topLabel=preds[0].label.replace(/_/g,' ');
  const conf=Math.round(preds[0].score*100);

  // Step 2: USDA lookup
  statusEl.innerHTML=`<div class="status-line"><div class="spinner"></div>✦ Détecté : <strong style="color:var(--gold);margin-left:4px">${topLabel}</strong> (${conf}%) · Recherche des nutriments…</div>`;

  let foods;
  try{
    foods=await fetchUSDA(topLabel,6);
  }catch(e){
    statusEl.innerHTML=`<div class="status-line" style="color:var(--danger)">⚠ USDA indisponible. Réessaie dans quelques secondes.</div>`;
    return;
  }

  statusEl.innerHTML='';

  if(!foods.length){
    document.getElementById('scan-result').innerHTML=`
      <div class="status-line" style="color:var(--gold)">✦ Détecté : ${topLabel} (${conf}%) — Cherche manuellement ci-dessous.</div>`;
    document.getElementById('scan-si').value=topLabel;
    doScanSearch();
    return;
  }

  // Show top result + alternatives
  const top=foods[0];
  const alts=foods.slice(1);
  const altHtml=alts.length?`
    <div style="margin-bottom:10px">
      <div style="font-size:11px;color:var(--fg3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;">Autres résultats</div>
      <div class="alt-list">${alts.map((f,i)=>`<div class="alt-item" data-idx="${i}"><span class="alt-name">${f.name}</span><span class="alt-kcal">${Math.round(f.kcal)} kcal/100g</span></div>`).join('')}</div>
    </div>`:'';

  const resultEl=document.getElementById('scan-result');
  resultEl.innerHTML=`
    <div class="ai-badge">🤖 IA: ${topLabel} · ${conf}% de confiance</div>
    ${altHtml}`;

  showFoodCard(top,'scan-result',true);

  // Wire alt items
  resultEl.querySelectorAll('.alt-item').forEach((el,i)=>{
    el.addEventListener('click',()=>{
      showFoodCard(alts[i],'scan-result',true);
      resultEl.querySelectorAll('.alt-item').forEach(a=>a.style.borderColor='');
      el.style.borderColor='var(--xp)';
    });
  });
});

// ═══════════════════════════════════════════
async function doUSDASearch(query,listId,cardId){
  if(!query.trim())return;
  const el=document.getElementById(listId);
  el.innerHTML=`<div class="status-line"><div class="spinner"></div>Recherche USDA…</div>`;
  try{
    const foods=await fetchUSDA(query,8);
    if(!foods.length){el.innerHTML=`<div class="empty"><div class="empty-ic">🔍</div><p>Aucun résultat.<br>Essaye en anglais !</p></div>`;return;}
    el.innerHTML=foods.map((f,i)=>`
      <div class="sr-item" data-idx="${i}">
        <div class="sr-name">${foodEmoji(f.name)} ${f.name}</div>
        <div class="sr-mac">${Math.round(f.kcal)} kcal · P${Math.round(f.prot)}g · G${Math.round(f.carb)}g · L${Math.round(f.fat)}g /100g</div>
        <div class="sr-cta">+ Ajouter</div>
      </div>`).join('');
    el.querySelectorAll('.sr-item').forEach((item,i)=>{
      item.addEventListener('click',()=>{el.innerHTML='';showFoodCard(foods[i],cardId);});
    });
  }catch(e){
    el.innerHTML=`<div class="status-line" style="color:var(--danger)">⚠ USDA indisponible. Vérifie ta connexion.</div>`;
  }
}

function doScanSearch(){doUSDASearch(document.getElementById('scan-si').value,'scan-sr','scan-fc');}
function doMainSearch(){doUSDASearch(document.getElementById('main-si').value,'main-sr','main-fc');}
